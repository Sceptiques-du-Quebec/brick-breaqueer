  lives: 2
  baseSpeed: 320
  maxSpeed: 1000
  comboThreshold: 800
  bonusChance: 16
  gridCols: 8
  gridRows: 4
  fontFamily: Arial
  fontWeight: 900
  color: #161616
  music: true
  effets: true
  musicVolume: 0.05
  effectsVolume: 0.18
