<!DOCTYPE html>
<html lang="fr-CA">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta property="og:locale" content="fr_CA">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Brick Breaqueer 🌈">
	<meta property="og:description" content="Jeu de briques ludique, éducatif et inclusif.">
	<meta property="og:url" content="https://sceptiquesduquebec.com/brick-breaqueer/">
	<meta property="og:image" content="https://sceptiquesduquebec.com/brick-breaqueer//images/ogimage.webp">
	<link rel="icon" type="image/x-icon" href="./favicon.ico">
	<title>Brick Breaqueer 🌈</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=block');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		body {
			background: yellow;
			color: #161616;
		}

		canvas {
			image-rendering: auto;
			display: block;
			margin: auto;
		}

		#game-container {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			aspect-ratio: 16 / 9;
			width: 100%;
			max-width: 887px;
			border-radius: 2rem;
			box-shadow:
				0 0 0.25rem 0.05rem red,
				0 0 0.5rem 0.1rem orange,
				0 0 0.75rem 0.15rem yellow,
				0 0 1rem 0.2rem lime,
				0 0 1.25rem 0.25rem cyan,
				0 0 1.5rem 0.3rem blue,
				0 0 1.75rem 0.35rem violet;
		}

		#game-container::before {
			content: "CHARGEMENT...";
			position: absolute;
			inset: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
			font-family: Unbounded;
			font-size: 2rem;
			font-weight: 900;
		}

		#game-container.loaded::before {
			display: none;
		}
	</style>
</head>
<body>
	<div id="game-container"></div>
	<script>
        const script = document.createElement('script');
        script.src = new URL('scripts/brickbreaqueer.core.min.js', window.location).href;
        script.async = true;
        script.onload = () => {
			BrickBreaqueer({
				parent: "game-container",
				width: 664,
				height: 498,
				fontFamily: "Unbounded",
				fontWeight: 500,
				color: '#161616',
				effets: false,
				music: true,
				onLoadComplete: async () => {
					await new Promise(resolve => setTimeout(resolve, 1000));
					document.querySelector('#game-container').classList.add('loaded');
					console.log("Interface externe masquée");
				},
				onGameOver: async (stats) => {
					console.log("Stats de fin de partie :", stats);
					await new Promise(resolve => setTimeout(resolve, 2000));
					console.log("Modal fermé");
				}
			});
		};
		document.head.appendChild(script);
	</script>
</body>
</html>
