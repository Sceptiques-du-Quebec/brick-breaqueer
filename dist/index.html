	<meta property="og:description" content="Jeu de briques ludique, éducatif et inclusif.">
	<meta property="og:url" content="https://sceptiquesduquebec.com/brick-breaqueer/">

<body>
	<div id="game-container"></div>
	<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
	<script>
        const script = document.createElement('script');
        script.src = new URL('scripts/brickbreaqueer.core.min.js', window.location).href;
        script.async = true;
        script.onload = () => {
			BrickBreaqueer({
				parent: "game-container",
				width: 664,
				height: 498,
				fontFamily: "Unbounded",
				fontWeight: 500,
				color: '#161616',
				onGameOver: async (stats) => {
					console.log("Stats de fin de partie :", stats);
					return new Promise((resolve) => {
						setTimeout(() => {
							console.log("Modal fermé");
							resolve();
						}, 2000);
					});
				}
			});
		};
		document.head.appendChild(script);
	</script>
</body>
