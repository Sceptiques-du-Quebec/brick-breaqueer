name: Deploy Next.js/Static site to Pages

on:
  push:
    branches: ["main"] # Ajustez si votre branche principale s'appelle master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Export
        run: |
          npm run build
          npm run export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # On indique à GitHub d'utiliser le dossier dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4